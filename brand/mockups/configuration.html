<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup — Configuration</title>
  <link rel="stylesheet" href="../research_light.css" />
  <style>
    /* Mock-only layout helpers (tokens from research_light.css) */
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .page-head h2 {
      margin: 0;
      font-size: var(--ca-fs-title);
      font-weight: 600;
      color: var(--ca-navy-900);
      font-family: var(--ca-font-ui);
    }
    .page-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .path-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 16px;
    }
    .path-row .ca-label {
      color: var(--ca-muted);
    }
    .config-panel {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 260px);
      min-height: 320px;
    }
    .config-editor {
      margin: 0;
      padding: 14px 16px;
      overflow: auto;
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      border: none;
      resize: none;
      outline: none;
      font-family: var(--ca-font-data);
      font-size: var(--ca-fs-data);
      line-height: 1.5;
      color: var(--ca-navy-900);
      background: var(--ca-panel);
      white-space: pre;
      tab-size: 2;
      min-height: 0;
    }
    .config-editor:focus {
      box-shadow: inset 0 0 0 2px rgba(30, 111, 191, 0.25);
    }
    .config-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }
    .config-footer .status {
      font-size: var(--ca-fs-label);
      font-family: var(--ca-font-ui);
      color: var(--ca-muted);
    }
    .config-footer .status.is-dirty {
      color: var(--ca-navy-900);
      font-weight: 600;
    }
    .config-footer .status.is-ok {
      color: #1a7a45;
      font-weight: 600;
    }
    .config-footer .status.is-err {
      color: var(--ca-negative);
      font-weight: 600;
    }
    .footer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }
    .ca-page {
      max-width: 1100px;
    }
  </style>
</head>
<body>
  <header class="ca-shell-header">
    <div class="ca-brand">
      <img src="../icons/backtester.png" alt="" width="28" height="28" />
      <h1 class="ca-title">CryoBacktester</h1>
    </div>
    <nav class="ca-nav" aria-label="Primary">
      <button type="button" class="ca-nav-btn">New Run</button>
      <button type="button" class="ca-nav-btn">Backtester Run</button>
      <button type="button" class="ca-nav-btn">Completed Runs</button>
      <button type="button" class="ca-nav-btn">Results Grid</button>
      <button type="button" class="ca-nav-btn">Combo Detail</button>
      <button type="button" class="ca-nav-btn">Favourites</button>
      <button type="button" class="ca-nav-btn is-active">Configuration</button>
    </nav>
  </header>

  <div class="ca-context-bar">
    <span class="ca-label">Run</span>
    <span class="ca-data">—</span>
    <span class="ca-label">Bundle</span>
    <span class="ca-data">—</span>
    <span class="ca-label">Combo</span>
    <span class="ca-data">—</span>
    <span class="ca-badge ca-badge-bt">Backtester</span>
    <span class="ca-badge ca-badge-muted">config</span>
  </div>

  <main class="ca-page">
    <div class="page-head">
      <h2>Configuration</h2>
      <div class="page-actions">
        <button type="button" class="ca-btn ca-btn-ghost" id="btn-revert" disabled>Revert</button>
      </div>
    </div>

    <div class="path-row">
      <span class="ca-label">Path</span>
      <span class="ca-data">backtester/core/config.toml</span>
      <span class="ca-badge ca-badge-ok" id="live-badge">live</span>
    </div>

    <div class="ca-panel config-panel" id="config-panel">
      <textarea class="config-editor" id="config-editor" spellcheck="false" aria-label="config.toml editor"># ── Backtester Application Configuration ─────────────────────────────────────
#
# Strategy-specific settings (PARAM_GRID, DATE_RANGE, entry logic) stay in
# each strategy file under workspace/strategies/. This file holds application-
# level settings only.
#
# Data-plane roots (market, reports/runs, klines, tardis, macro) are resolved by
# backtester.core.paths (defaults: repo data/market, data/runs, …). Env overrides:
# CRYOBT_MARKET_DATA, CRYOBT_RUNS, CRYOBT_KLINE_DIR / CRYOTRADER_KLINE_DIR, etc.
# TOML path fields below are legacy documentation; the loader prefers paths.py.

# ── Data ──────────────────────────────────────────────────────────────────────
[data]

# Historical: relative to backtester/. Prefer paths.py / env for new setups.
# Default market snapshots live at {repo}/data/market/ (options_*.parquet, spot_*.parquet).
options_parquet     = &quot;data&quot;
spot_parquet        = &quot;data&quot;
macro_calendar_dir  = &quot;data/macro/economic_events/us_scheduled&quot;

# Raw tick data / snapshot dirs (ingest); resolved via paths.py when env set.
tardis_data_dir     = &quot;ingest/tardis/data&quot;
snapshots_dir       = &quot;data&quot;
reports_dir         = &quot;reports&quot;   # effective default: {repo}/data/runs

# Snapshot cadences (minutes).
snapshot_interval_min   = 5   # option snapshot grid resolution
spot_interval_min       = 1   # spot OHLC bar resolution

# Parquet output compression codec (zstd recommended for size/speed balance).
parquet_compression = &quot;zstd&quot;

# ── Simulation ────────────────────────────────────────────────────────────────
[simulation]

account_size_usd        = 100_000  # virtual account size (used in equity curve)
progress_interval       = 500     # print engine progress every N market states
top_n_console           = 5       # top combos printed to terminal after run
top_n_report            = 20      # top combos for detailed equity metrics in HTML report
grid_workers_hard_cap          = 16  # max inner combo-shard processes
grid_min_combos_parallel       = 8   # below this, never multi-process
grid_min_combos_per_worker     = 8   # don&#x27;t pay spawn/merge for tiny shards

# ── Pricing ───────────────────────────────────────────────────────────────────
[pricing]

hours_per_year          = 8760.0  # calendar denominator for T in Black-Scholes
risk_free_rate          = 0.0     # r in BS (negligible for sub-24h crypto options)
expiry_hour_utc         = 8       # Deribit 0DTE daily expiry time (UTC)
strike_step_usd         = 500     # Deribit strike grid increment ($)

# Realized-vol estimation window
vol_lookback_candles    = 24      # trailing candles used for realized-vol estimate
min_vol_candles         = 6       # minimum candles required before using realized vol
default_vol             = 0.55    # fallback annualised vol when data is insufficient
gap_reset_seconds       = 7200    # max gap (2 h) before resetting log-return window

# Vol clamps — prevent numerical blowups in Black-Scholes
min_vol                 = 0.15    # floor: 15% annualised
max_vol                 = 3.00    # ceiling: 300% annualised

# ── Repricing ─────────────────────────────────────────────────────────────────
[repricing]

# Fallback pricing for held positions when bid or ask is 0 (no market quote).
# Applied only during mark-to-market repricing of open positions — entry logic
# is unaffected (no quote = no entry, unchanged).
#
# Three-tier logic in _reprice_legs:
#   1. bid/ask &gt; 0   → use as-is (normal path)
#   2. bid/ask == 0 AND mark_usd &gt; min_mark_usd  → mark × (1 ± slip_pct_zero_price)
#   3. bid/ask == 0 AND mark_usd ≤ min_mark_usd  → treat as 0 (skip tick, as before)

# Minimum mark in USD for the fallback to activate.
# Below this the option is too deep OTM / illiquid for any estimate to be meaningful.
min_mark_usd            = 15.0

# Slippage fraction applied to mark when constructing the fallback price.
# ask_fallback = mark × (1 + slip_pct_zero_price)   (cost to buy back short)
# bid_fallback = mark × (1 - slip_pct_zero_price)   (proceeds from selling long)
# 0.25 = 25% — conservative central estimate for thin crypto option markets.
slip_pct_zero_price     = 0.25

# ── Fee Model ─────────────────────────────────────────────────────────────────
# Two tiers are defined below. Only [fees] is active — the other is commented out.
# To switch back to standard retail fees: swap which block is commented.
#
# VIP1 tier  (ACTIVE)
# BTC Option: 0.025% of underlying index, capped at 10.42% of option premium
# BTC Perpetual taker: 0.035%  |  maker: -0.01% rebate
[fees]

model           = &quot;deribit_vip1&quot;  # fee model identifier
index_rate      = 0.00025         # 0.025% of index price per option leg
price_cap_frac  = 0.1042          # capped at 10.42% of the option leg price
perp_taker_rate = 0.00035         # 0.035% taker fee per BTC-PERPETUAL trade

# ── Standard retail tier (commented out — uncomment to revert) ──
# [fees]
# model           = &quot;deribit&quot;   # fee model identifier
# index_rate      = 0.0003      # 0.03% (3 bps) of index price per option leg
# price_cap_frac  = 0.125       # capped at 12.5% of the option leg price
# perp_taker_rate = 0.0005      # 0.05% taker fee per BTC-PERPETUAL trade

# ── Scoring ───────────────────────────────────────────────────────────────────
[scoring]

# Combos with fewer trades than this are ineligible for scoring (ranked last).
min_trades          = 10

# Percentile-rank weights — must sum to 1.0.
# Each metric is ranked 0→1 across all eligible combos before weighting.
# max_dd_pct and ulcer are INVERTED (1 − rank) so lower values = better score.
w_sharpe        = 0.15   # risk-adjusted return (higher = better)
w_pnl           = 0.20   # total PnL (higher = better)
w_max_dd        = 0.15   # max drawdown % intraday (lower = better — inverted)
w_profit_factor = 0.08   # gross win / gross loss (higher = better)
w_r_squared     = 0.15   # R² of equity curve vs linear trend (higher = better)
w_omega         = 0.07   # Omega ratio of daily returns (higher = better)
w_ulcer         = 0.15   # Ulcer Index (lower = better — inverted)
w_consistency   = 0.05   # fraction of calendar months with positive return (higher = better)

# ── Recency overlay ───────────────────────────────────────────────────────────
# Treats the trailing portion of the backtest as a pseudo-OOS window.
# The composite score is blended: (1 - recency_weight) × full_score + recency_weight × recent_score.
# Recent score is the percentile-ranked blend of recent-window Sharpe (60%) + PnL (40%).
# Set recency_pct = 0.0 to disable entirely.

# Fraction of the total date range used as the recency window (0.0–1.0).
# Examples: 0.10 → last 10 days of a 100-day test; last 1 day of a 10-day test.
recency_pct         = 0.20

# Weight of the recent-window score in the composite (0.0 = full-period only).
recency_weight      = 0.30

# Minimum number of active days (non-zero NAV change) required in the recency window
# for a combo to receive a proper recent score. Combos below this get a neutral 0.5.
recency_min_trades  = 3

# Hard gate: veto combos whose recent-window Sharpe falls below this threshold.
# Vetoed combos receive score 0.0 and sink to the bottom of the ranking.
# Set recency_gate_enabled = false to disable the gate entirely.
recency_gate_enabled    = true
recency_gate_sharpe     = 0.3   # require mild positive recent Sharpe (0.0 = just profitable, 0.5 = stricter)
</textarea>
    </div>

    <div class="config-footer">
      <span class="status" id="status">Loaded · no unsaved changes</span>
      <div class="footer-actions">
        <button type="button" class="ca-btn ca-btn-secondary" id="btn-cancel">Cancel</button>
        <button type="button" class="ca-btn ca-btn-primary" id="btn-ok" disabled>OK</button>
      </div>
    </div>
  </main>

  <script>
    const editor = document.getElementById("config-editor");
    const status = document.getElementById("status");
    const btnOk = document.getElementById("btn-ok");
    const btnCancel = document.getElementById("btn-cancel");
    const btnRevert = document.getElementById("btn-revert");
    const liveBadge = document.getElementById("live-badge");
    let baseline = editor.value;

    function setDirty(dirty) {
      btnOk.disabled = !dirty;
      btnRevert.disabled = !dirty;
      if (dirty) {
        status.textContent = "Unsaved edits · OK applies to disk and reloads live config";
        status.className = "status is-dirty";
        liveBadge.textContent = "edited";
        liveBadge.className = "ca-badge ca-badge-muted";
      } else {
        status.textContent = "Loaded · no unsaved changes";
        status.className = "status";
        liveBadge.textContent = "live";
        liveBadge.className = "ca-badge ca-badge-ok";
      }
    }

    editor.addEventListener("input", () => {
      setDirty(editor.value !== baseline);
    });

    btnOk.addEventListener("click", () => {
      const text = editor.value;
      if (!text.includes("[") || !text.includes("=")) {
        status.textContent = "Invalid TOML · fix syntax before OK";
        status.className = "status is-err";
        return;
      }
      baseline = text;
      setDirty(false);
      status.textContent = "Saved · config reloaded · live for new runs";
      status.className = "status is-ok";
    });

    btnCancel.addEventListener("click", () => {
      editor.value = baseline;
      setDirty(false);
    });

    btnRevert.addEventListener("click", () => {
      editor.value = baseline;
      setDirty(false);
    });

    document.querySelectorAll(".ca-nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".ca-nav-btn").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
      });
    });
  </script>
</body>
</html>
